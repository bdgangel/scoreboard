<!doctype html>
<html lang="en">
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">  
<title>Brad's Dashboard</title>  
<style>    
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap');
    :root { --cyan:#4df7ff; --green:#39ff88; --orange:#ff9d24; --ink:#030711; --panel:rgba(4,13,32,.86); --line:rgba(77,247,255,.48); --muted:#9bb8d2; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:#ebfbff; font-family:Rajdhani,Arial,sans-serif; background: radial-gradient(ellipse at 16% 0%,#102e63 0,transparent 40%), radial-gradient(ellipse at 95% 100%,#281454 0,transparent 42%), var(--ink); overflow-x:hidden; }    
body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.25; background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 5px); mix-blend-mode:overlay; }
    .shell { min-height:100vh; padding:1.3vw 1.7vw; display:grid; grid-template-rows:auto 1fr; gap:1.2vw; }
    .top { display:grid; grid-template-columns:1fr 3fr; gap:1.2vw; }.clock { order:-1; }
    .panel { position:relative; overflow:hidden; border:1px solid var(--line); background:linear-gradient(110deg,rgba(7,19,46,.94),rgba(1,7,20,.88)); box-shadow:0 0 11px rgba(77,247,255,.27),inset 0 0 25px rgba(31,118,255,.11); clip-path:polygon(0 0,97.5% 0,100% 12%,100% 100%,2.5% 100%,0 88%); }
    .panel:after { content:""; position:absolute; height:1px; width:100%; left:0; top:50%; background:linear-gradient(90deg,transparent,rgba(77,247,255,.16),transparent); }
    .weather { min-height:220px; padding:17px 24px; display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:stretch; } .weather-today { min-width:0; display:flex; flex-direction:column; justify-content:center; } .weather-forecast { min-width:0; display:flex; flex-direction:column; padding-left:18px; border-left:1px solid rgba(77,247,255,.28); } .forecast-heading { color:var(--cyan); font:700 12px Orbitron,sans-serif; letter-spacing:.16em; margin-bottom:8px; }
    .eyebrow { color:var(--cyan); font:700 12px Orbitron,sans-serif; letter-spacing:.18em; text-transform:uppercase; text-shadow:0 0 9px var(--cyan); }
    .weather-city { font:700 clamp(18px,2vw,28px) Orbitron,sans-serif; margin-top:4px; }.condition { color:var(--muted); font-size:18px; text-transform:uppercase; letter-spacing:.09em; }
    .temp { color:var(--cyan); font:800 clamp(48px,7vw,82px) Orbitron,sans-serif; line-height:.93; text-shadow:0 0 16px rgba(77,247,255,.66); }.temp sup { font-size:.36em; vertical-align:top; }
    .weather-details { display:grid; grid-template-columns:repeat(2,minmax(76px,1fr)); gap:7px 24px; margin-top:13px; }.metric { color:var(--muted); font-size:15px; text-transform:uppercase; letter-spacing:.08em; }.metric b { color:#fff; margin-left:6px; font-size:17px; }.forecast { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; flex:1; min-height:0; }.forecast-day { min-width:0; height:100%; padding:7px 10px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; border-top:0; border-left:1px solid rgba(77,247,255,.35); background:rgba(77,247,255,.06); }.forecast-label { color:var(--cyan); font:700 11px Orbitron,sans-serif; letter-spacing:.1em; }.forecast-condition { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.forecast-temps { color:#fff; font:700 14px Orbitron,sans-serif; white-space:nowrap; }
    .clock { min-height:154px; padding:14px 25px; text-align:left; }.time { color:var(--orange); font:800 clamp(38px,5.4vw,72px) Orbitron,sans-serif; letter-spacing:.045em; line-height:1; text-shadow:0 0 16px rgba(255,157,36,.62); }.calendar { color:#d5e4f2; font:600 clamp(16px,1.8vw,23px) Orbitron,sans-serif; letter-spacing:.08em; margin-top:7px; }.countdown { display:inline-block; margin-top:12px; padding:6px 11px; border-left:2px solid var(--orange); background:rgba(255,157,36,.08); color:#ffca78; font:600 16px Orbitron,sans-serif; letter-spacing:.08em; }
    .standings { min-height:0; padding:18px 20px 20px; display:grid; grid-template-rows:auto auto auto 1fr; border-color:rgba(57,255,136,.6); background:linear-gradient(110deg,rgba(4,36,30,.94),rgba(1,12,16,.91)); box-shadow:0 0 13px rgba(57,255,136,.29),inset 0 0 25px rgba(57,255,136,.10); }.league-title { display:flex; align-items:center; gap:12px; color:#fff; font:800 clamp(18px,2.3vw,31px) Orbitron,sans-serif; letter-spacing:.12em; }.league-title:after { content:""; height:1px; flex:1; background:linear-gradient(90deg,var(--green),transparent); box-shadow:0 0 8px var(--green); }.favorites-label { color:#ffca78; font:700 11px Orbitron,sans-serif; letter-spacing:.18em; margin:10px 0 6px; }.favorite-summaries { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }.favorite-summary { min-width:0; padding:8px 10px; border-left:3px solid var(--orange); background:linear-gradient(90deg,rgba(255,157,36,.17),rgba(255,157,36,.035)); }.favorite-top { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; }.team-logo { width:44px; height:44px; object-fit:contain; }.favorite-name { font:700 clamp(14px,1.55vw,20px) Orbitron,sans-serif; letter-spacing:.04em; }.favorite-record { color:#fff; font:800 clamp(18px,2.2vw,29px) Orbitron,sans-serif; text-align:right; }.favorite-pct { color:#ffca78; font:700 11px Orbitron,sans-serif; text-align:right; }.game-pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }.game-label { color:#9cbfae; font:700 9px Orbitron,sans-serif; letter-spacing:.12em; }.game-line { color:#fff; font:700 clamp(13px,1.35vw,17px) Orbitron,sans-serif; white-space:nowrap; }.game-meta { color:#bad2c3; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.standings-break { display:flex; align-items:center; gap:10px; margin-top:13px; color:var(--green); font:700 11px Orbitron,sans-serif; letter-spacing:.2em; text-shadow:0 0 8px var(--green); }.standings-break:before,.standings-break:after { content:""; height:1px; background:rgba(57,255,136,.7); box-shadow:0 0 8px var(--green); }.standings-break:before { width:36px; }.standings-break:after { flex:1; }.leagues { display:grid; grid-template-rows:1fr 1fr; min-height:0; gap:13px; margin-top:8px; }.league { min-height:0; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }.league + .league { border-top:1px solid rgba(57,255,136,.32); padding-top:12px; }.division { min-width:0; }.division-name { color:var(--green); font:700 12px Orbitron,sans-serif; letter-spacing:.18em; text-transform:uppercase; text-shadow:0 0 9px var(--green); padding:0 7px 5px; border-bottom:1px solid rgba(57,255,136,.58); }.head,.team { display:grid; grid-template-columns:1fr repeat(5,clamp(28px,3.2vw,49px)); column-gap:4px; align-items:center; }.head { color:#9cbfae; font:700 11px Orbitron,sans-serif; letter-spacing:.04em; padding:5px 7px 3px; }.head span:not(:first-child),.team span:not(:first-child) { text-align:center; }.team { height:clamp(23px,3.2vh,36px); padding:0 7px; border-bottom:1px solid rgba(123,205,159,.15); color:#e0f4e8; font-size:clamp(14px,1.42vw,19px); font-weight:600; }.team .club { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }.team .streak { color:#b3d9c3; }.favorite { color:#fff; background:linear-gradient(90deg,rgba(255,157,36,.32),rgba(255,157,36,.07)); border-left:3px solid var(--orange); box-shadow:inset 0 0 15px rgba(255,157,36,.12); }.favorite .club { color:#ffce82; font-weight:700; text-shadow:0 0 8px rgba(255,157,36,.6); }.loading { color:#a2d8b8; font:600 18px Orbitron,sans-serif; padding:30px; }    
@media (max-width:720px) { .shell { padding:10px; }.top,.league,.favorite-summaries { grid-template-columns:1fr; }.clock { order:initial; text-align:left; }.weather { min-height:0; grid-template-columns:1fr; }.weather-forecast { padding-left:0; padding-top:14px; border-left:0; border-top:1px solid rgba(77,247,255,.28); }.forecast { grid-template-columns:repeat(3,minmax(0,1fr)); }.forecast-day { display:block; }.weather { min-height:0; }.leagues { grid-template-rows:auto; }.league + .league { border-top:1px solid rgba(57,255,136,.32); }.standings { overflow:visible; }.team { height:28px; } }  
</style>
</head>
<body>  
<main class="shell">    
<section class="top">      
<article class="panel weather"><div class="weather-today"><div class="eyebrow">Local Weather // <span id="weatherCity">Set Location</span></div><div id="condition" class="condition">Loading atmospheric data</div><div class="weather-details"><div class="metric">High <b id="high">--</b></div><div class="metric">Feels <b id="feels">--</b></div><div class="metric">Low <b id="low">--</b></div><div class="metric">Precip <b id="precip">--</b></div></div><div class="temp" id="temp">--<sup>°</sup></div></div><div class="weather-forecast"><div class="forecast-heading">NEXT 3 DAYS</div><div class="forecast" id="forecast" aria-label="Next 3 days forecast"></div></div></article>      
<article class="panel clock"><div class="eyebrow">Local Time // Gangel Dashboard</div><div class="time" id="time">--:--</div><div class="calendar" id="calendar">--- --/--/--</div><div class="countdown" id="countdown">JAN 24 2027 // -- DAYS</div></article>    
</section>    
<section class="panel standings"><div class="league-title">MLB // LIVE STANDINGS</div><div><div class="favorites-label">Favorites // Game Center</div><div id="favorites" class="favorite-summaries"><div class="loading">SYNCING FAVORITES…</div></div></div><div class="standings-break"><span>FULL STANDINGS</span></div><div id="leagues" class="leagues"><div class="loading">SYNCING LEAGUE DATA…</div></div></section>  
</main>  
<script>    
// Weather location: West Bend, Wisconsin (ZIP 53095).    
const WEATHER_LOCATION = { city: 'WEST BEND, WI 53095', latitude: 43.4253, longitude: -88.1834 };    
const favoriteTeams = new Set(['CLE','ATL','MIL']);    
const favoriteInfo = { CLE:{id:114,name:'Cleveland Guardians'}, ATL:{id:144,name:'Atlanta Braves'}, MIL:{id:158,name:'Milwaukee Brewers'} };    
const codes = { 'Arizona Diamondbacks':'ARI','Athletics':'ATH','Atlanta Braves':'ATL','Baltimore Orioles':'BAL','Boston Red Sox':'BOS','Chicago Cubs':'CHC','Chicago White Sox':'CWS','Cincinnati Reds':'CIN','Cleveland Guardians':'CLE','Colorado Rockies':'COL','Detroit Tigers':'DET','Houston Astros':'HOU','Kansas City Royals':'KC','Los Angeles Angels':'LAA','Los Angeles Dodgers':'LAD','Miami Marlins':'MIA','Milwaukee Brewers':'MIL','Minnesota Twins':'MIN','New York Mets':'NYM','New York Yankees':'NYY','Philadelphia Phillies':'PHI','Pittsburgh Pirates':'PIT','San Diego Padres':'SD','San Francisco Giants':'SF','Seattle Mariners':'SEA','St. Louis Cardinals':'STL','Tampa Bay Rays':'TB','Texas Rangers':'TEX','Toronto Blue Jays':'TOR','Washington Nationals':'WSH' };    
const order = ['American League','National League']; const divisions = ['West','Central','East'];    
function clock(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); document.getElementById('time').textContent=`${p(d.getHours())}:${p(d.getMinutes())}`; document.getElementById('calendar').textContent=`${['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]} ${p(d.getMonth()+1)}/${p(d.getDate())}/${String(d.getFullYear()).slice(-2)}`; const target=new Date(2027,0,24), today=new Date(d.getFullYear(),d.getMonth(),d.getDate()); document.getElementById('countdown').textContent=`JAN 24 2027 // ${Math.max(0,Math.ceil((target-today)/86400000))} DAYS`; } clock(); setInterval(clock,1000);    
function num(v){ return v === undefined || v === null ? '—' : v; }    
function divisionMarkup(div, teams){ return `<section class="division"><div class="division-name">${div}</div><div class="head"><span>TEAM</span><span>W</span><span>L</span><span>PCT</span><span>GB</span><span>STRK</span></div>${teams.map(r=>{const t=r.team, abbr=codes[t.name]||t.abbreviation||t.name; return `<div class="team ${favoriteTeams.has(abbr)?'favorite':''}"><span class="club">${abbr} <span style="opacity:.78">${t.name.replace(/^.*?\s(?=[^\s]+$)/,'')}</span></span><span>${r.wins}</span><span>${r.losses}</span><span>${r.winningPercentage}</span><span>${num(r.gamesBack)}</span><span class="streak">${r.streak?.streakCode||'—'}</span></div>`;}).join('')}</section>`; }    
function gameData(game, teamId){ const away=game.teams.away, home=game.teams.home, mine=away.team.id===teamId?away:home, other=away.team.id===teamId?home:away; return { opponent: `${away.team.id===teamId?'@':'VS'} ${codes[other.team.name]||other.team.abbreviation}`, score: game.status.abstractGameState==='Final' ? `${mine.score>other.score?'W':'L'} ${mine.score}–${other.score}` : new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'}).format(new Date(game.gameDate)) }; }    
async function favoriteSchedule(code){ const team=favoriteInfo[code], now=new Date(), day=d=>d.toISOString().slice(0,10), start=new Date(now); start.setDate(start.getDate()-10); const end=new Date(now); end.setDate(end.getDate()+10); const r=await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${team.id}&startDate=${day(start)}&endDate=${day(end)}&gameType=R`); if(!r.ok) throw Error(); const games=(await r.json()).dates.flatMap(d=>d.games), last=games.filter(g=>g.status.abstractGameState==='Final').sort((a,b)=>new Date(b.gameDate)-new Date(a.gameDate))[0], next=games.filter(g=>new Date(g.gameDate)>now&&g.status.abstractGameState!=='Final').sort((a,b)=>new Date(a.gameDate)-new Date(b.gameDate))[0]; return {last:last&&gameData(last,team.id),next:next&&gameData(next,team.id)}; }    
function renderFavorites(records, schedules={}){ const recs={}; records.forEach(d=>d.teamRecords.forEach(r=>{const c=codes[r.team.name]||r.team.abbreviation; if(favoriteTeams.has(c)) recs[c]=r;})); document.getElementById('favorites').innerHTML=[...favoriteTeams].map(c=>{const r=recs[c], s=schedules[c]||{}, team=favoriteInfo[c]; return `<article class="favorite-summary"><div class="favorite-top"><img class="team-logo" src="https://www.mlbstatic.com/team-logos/team-cap-on-dark/${team.id}.svg" alt="${team.name} logo"><div class="favorite-name">${team.name.replace(' ','<br>')}</div><div><div class="favorite-record">${r?`${r.wins}–${r.losses}`:'--'}</div><div class="favorite-pct">${r?.winningPercentage||'---'} PCT</div></div></div><div class="game-pair"><div><div class="game-label">Last Game</div><div class="game-line">${s.last?.opponent||'—'}</div><div class="game-meta">${s.last?.score||'Loading…'}</div></div><div><div class="game-label">Next Game</div><div class="game-line">${s.next?.opponent||'—'}</div><div class="game-meta">${s.next?.score||'Loading…'}</div></div></div></article>`;}).join(''); }    
function renderStandings(records){ const byLeague={}; records.forEach(d=>{const lg=d.league.name, div=d.division.name.replace(/^(American|National) League /,''); (byLeague[lg]??={})[div]=d.teamRecords;}); document.getElementById('leagues').innerHTML=order.map(lg=>`<div class="league">${divisions.map(d=>divisionMarkup(d,byLeague[lg]?.[d]||[])).join('')}</div>`).join(''); renderFavorites(records); Promise.all([...favoriteTeams].map(async c=>[c,await favoriteSchedule(c)])).then(pairs=>renderFavorites(records,Object.fromEntries(pairs))).catch(()=>{}); }    
async function standings(){ try { const season=new Date().getFullYear(); const r=await fetch(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=${season}&standingsTypes=regularSeason&hydrate=team,division,league,streak`); if(!r.ok) throw Error(); const data=await r.json(); renderStandings(data.records); } catch { document.getElementById('leagues').innerHTML='<div class="loading">LEAGUE DATA UNAVAILABLE — CHECK NETWORK CONNECTION</div>'; } } standings(); setInterval(standings,300000);    
const weatherCodes={0:'CLEAR',1:'MAINLY CLEAR',2:'PARTLY CLOUDY',3:'OVERCAST',45:'FOG',48:'RIME FOG',51:'LIGHT DRIZZLE',53:'DRIZZLE',55:'HEAVY DRIZZLE',61:'LIGHT RAIN',63:'RAIN',65:'HEAVY RAIN',71:'LIGHT SNOW',73:'SNOW',75:'HEAVY SNOW',80:'RAIN SHOWERS',81:'RAIN SHOWERS',82:'HEAVY SHOWERS',95:'THUNDERSTORM'};    
async function weather(){ document.getElementById('weatherCity').textContent=WEATHER_LOCATION.city; try { const q=new URLSearchParams({latitude:WEATHER_LOCATION.latitude,longitude:WEATHER_LOCATION.longitude,current:'temperature_2m,apparent_temperature,precipitation,weather_code',daily:'temperature_2m_max,temperature_2m_min,weather_code',temperature_unit:'fahrenheit',precipitation_unit:'inch',timezone:'auto'}); const r=await fetch(`https://api.open-meteo.com/v1/forecast?${q}`); if(!r.ok) throw Error(); const d=await r.json(), c=d.current; document.getElementById('temp').innerHTML=`${Math.round(c.temperature_2m)}<sup>°</sup>`; document.getElementById('condition').textContent=weatherCodes[c.weather_code]||'CURRENT CONDITIONS'; document.getElementById('feels').textContent=`${Math.round(c.apparent_temperature)}°`; document.getElementById('high').textContent=`${Math.round(d.daily.temperature_2m_max[0])}°`; document.getElementById('low').textContent=`${Math.round(d.daily.temperature_2m_min[0])}°`; document.getElementById('precip').textContent=`${c.precipitation.toFixed(2)} IN`; document.getElementById('forecast').innerHTML=d.daily.time.slice(1,4).map((date,i)=>{ const day=new Intl.DateTimeFormat('en-US',{weekday:'short'}).format(new Date(`${date}T12:00:00`)); const code=d.daily.weather_code[i+1]; return `<div class="forecast-day"><div class="forecast-label">${day}</div><div class="forecast-condition">${weatherCodes[code]||'FORECAST'}</div><div class="forecast-temps">${Math.round(d.daily.temperature_2m_max[i+1])}° / ${Math.round(d.daily.temperature_2m_min[i+1])}°</div></div>`; }).join(''); } catch { document.getElementById('condition').textContent='WEATHER DATA UNAVAILABLE'; } } weather(); setInterval(weather,600000);  
</script>
</body>
</html>
